[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-dmv-participation-lab"
version = "0.5.0"
description = "Source-bounded prototype for machine plate governance, cryptographic proof and consented transfer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT for code only; see PAPERS/README.md"}
authors = [{name = "Mitchell D. McPhetridge"}]

[project.scripts]
virtual-dmv = "virtual_dmv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
